version: 2
updates:
  - package-ecosystem: "bun"
    directory: "/"
    schedule:
      interval: "monthly"
    assignees:
      - "DonovanDMC"
    commit-message:
      include: "scope"
      prefix: ""
    target-branch: "master"
    versioning-strategy: "increase"
    labels:
      - "dependencies"
    # one pr per group instead of one per package
    groups:
      dependencies:
        dependency-type: "production"
      dev-dependencies:
        dependency-type: "development"
    ignore:
      # typescript-eslint only supports typescript <6.1.0
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # eslint 10 needs @uwu-codes/eslint-config to support it first, and these move together
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@eslint/js"
        update-types: ["version-update:semver-major"]
      # kept on the same minor as the bun runtime (.bun-version, Dockerfile)
      - dependency-name: "@types/bun"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
