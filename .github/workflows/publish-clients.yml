name: Publish Clients
permissions:
    contents: read
    id-token: write
on:
    workflow_dispatch:
        inputs:
            client:
                description: Which client to publish
                type: choice
                options: [typescript, ruby, both]
                default: both

jobs:
    checks:
        uses: ./.github/workflows/clients.yml
    typescript:
        if: inputs.client != 'ruby'
        needs: [checks]
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: clients/typescript
        steps:
            - uses: actions/checkout@v6
            - uses: pnpm/action-setup@v4
              with:
                  package_json_file: clients/typescript/package.json
                  standalone: true
            - uses: actions/setup-node@v4
              with:
                  node-version-file: clients/typescript/.node-version
                  registry-url: https://registry.npmjs.org/
            - name: Update NPM # Needed for OIDC
              run: npm i -g npm@"^11.5"
            - run: pnpm i --frozen-lockfile --ignore-scripts
            - run: pnpm publish --no-git-checks
    ruby:
        if: inputs.client != 'typescript'
        needs: [checks]
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: clients/ruby
        steps:
            - uses: actions/checkout@v6
            - uses: ruby/setup-ruby@v1
              with:
                  ruby-version: .ruby-version
                  working-directory: clients/ruby
                  bundler-cache: true
            # trusted publishing only creates a new gem when the workflow says which account owns it, and
            # rubygems/configure-rubygems-credentials can't pass that yet, so the token is exchanged here
            - name: Get a RubyGems API key
              run: |
                  jwt=$(curl -sS --fail-with-body -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=rubygems.org" | jq -r .value)
                  echo "::add-mask::$jwt"
                  key=$(curl -sS --fail-with-body -X POST https://rubygems.org/api/v1/oidc/trusted_publisher/exchange_token -H "Content-Type: application/json" -d "$(jq -n --arg jwt "$jwt" --arg owner "$OWNER" '{jwt: $jwt, owner: $owner}')" | jq -r .rubygems_api_key)
                  echo "::add-mask::$key"
                  echo "GEM_HOST_API_KEY=$key" >> "$GITHUB_ENV"
              env:
                  OWNER: Donovan_DMC
            - run: gem build e621stream.gemspec
            - run: gem push e621stream-*.gem
