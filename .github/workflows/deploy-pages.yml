name: Deploy Pages
on:
    push:
        branches:
            - master
        paths:
            - pages/**
            - scripts/pages.ts
            - .github/workflows/deploy-pages.yml
    workflow_dispatch:

permissions:
    contents: read
    deployments: write

jobs:
    deploy:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v6
            - uses: oven-sh/setup-bun@v2
            - run: bun i --frozen-lockfile --ignore-scripts
            - run: bun run build:pages
            - uses: DonovanDMC/PagesDeployServer@master
              with:
                  directory: dist-pages
                  token: ${{ secrets.PAGES_DEPLOY_TOKEN }}
                  domain: e621.stream
